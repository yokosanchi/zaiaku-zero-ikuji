name: daily-article

on:
  schedule:
    # 混雑を避けて毎時00分ではなくズラす。JST 07:23 / 21:23
    - cron: "23 22 * * *" # 07:23 JST（UTC+9）
    - cron: "23 12 * * *" # 21:23 JST（UTC+9）
  workflow_dispatch:
    inputs:
      type:
        description: "記事タイプを指定（省略でローテーション）"
        required: false
        type: choice
        options: ["", trend, basics, service, voice, cheer]
        default: ""

concurrency:
  group: daily-article
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (日本語フォント — サムネカード用)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pip install -r scripts/requirements.txt
      - run: npm ci

      - name: Generate today's article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # 既存記事を毎回1本、軽くリライト（導入をペインに寄せて締める）。Variable で上書き可。
          IMPROVE_MODE: ${{ vars.IMPROVE_MODE || 'full' }}
          THUMB_HEADLINE: ${{ vars.THUMB_HEADLINE }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          ARGS="--daily"
          if [ -n "${{ github.event.inputs.type }}" ]; then ARGS="$ARGS --type ${{ github.event.inputs.type }}"; fi
          python scripts/pipeline.py $ARGS

      - name: Show result
        run: |
          echo "### 生成結果" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/last_result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check result
        run: |
          R=$(python -c "import json;print(json.load(open('data/last_result.json'))['result'])")
          X=$(python -c "import json;print(json.load(open('data/last_result.json')).get('x',''))")
          echo "result=$R  x=$X"
          if [ "$R" = "no_key" ]; then
            echo "::error::GEMINI_API_KEY (Secret) が未設定です。Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          if [ "$R" = "error" ]; then
            echo "::error::パイプラインでエラー。ログを確認してください。"
            exit 1
          fi
          if [ "$R" = "rate_limited" ]; then
            echo "::warning::Gemini の無料枠上限に達したため今回は記事を作りませんでした。次回の実行で回復します。"
          fi
          if [ "$X" = "no_keys" ]; then
            echo "::warning::X 投稿キー4種が未設定のため投稿をスキップしました（記事公開には影響なし）。"
          fi
          if [ "$X" = "failed" ]; then
            echo "::warning::X 投稿に失敗しました（記事公開には影響なし）。ログの 'X: 投稿失敗' を確認してください。"
          fi
          TH=$(python -c "import json;print(json.load(open('data/last_result.json')).get('threads',''))")
          if [ "$TH" = "failed" ]; then
            echo "::warning::Threads 投稿に失敗しました（記事公開には影響なし）。ログの 'Threads: 投稿失敗' を確認してください。"
          fi

      - name: Verify build
        run: npm run build

      - name: Commit & push
        run: |
          git config user.name "kzi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 生成物をステージ（存在しないパスがあっても止まらないよう1つずつ）
          for p in src/content/blog public/images data REVIEW.md; do
            [ -e "$p" ] && git add -A "$p"
          done
          if git diff --cached --quiet; then
            echo "変更なし（ネタ切れ等）。何もしない。"
            exit 0
          fi
          # 注意: [skip ci] は付けない。Cloudflare Pages がその文字列でデプロイを丸ごとスキップするため。
          # このワークフローは push では起動しない（schedule / workflow_dispatch のみ）ので自己ループはしない。
          git commit -m "chore(content): 自動記事更新 $(date -u +%F)"
          git push

      # Cloudflare の GitHub 連携に依存せず、ここから直接デプロイする（連携が切れても確実に公開される）。
      # 必要な Secrets: CLOUDFLARE_API_TOKEN（テンプレート「Edit Cloudflare Workers」）, CLOUDFLARE_ACCOUNT_ID
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=zaiaku-zero-ikuji --branch=main --commit-dirty=true
