name: deploy

# 手動専用。記事生成なし（Gemini不使用）でビルド＋Cloudflareへデプロイするだけ。
# 「記事以外の修正を push したのを今すぐ反映したい」時に使う。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/topic-bank.yml'
      - 'data/state.json'
      - 'data/improvement-log.md'
      - 'REVIEW.md'

concurrency:
  group: daily-article # daily と同じグループ（同時デプロイを避ける）
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=zaiaku-zero-ikuji --branch=main --commit-dirty=true
