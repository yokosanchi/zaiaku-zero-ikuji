name: daily-article

on:
  schedule:
    # 混雑を避けて毎時00分ではなくズラす。JST 07:23 / 21:23
    # 2026-09-12〜25: shinmama/saino/kakawari/sns/okane新設カテゴリの積み増しのため
    # 一時的に2→3本/日に増量していたが、2026-09-25時点で全カテゴリ8〜14本まで揃ったため
    # （かつGeminiの無料枠上限(HTTP 429)に日常的に当たるようになったため）2本/日に戻した。
    - cron: "23 22 * * *" # 07:23 JST（UTC+9）
    - cron: "23 12 * * *" # 21:23 JST（UTC+9）
  workflow_dispatch:
    inputs:
      type:
        description: "記事タイプを指定（省略でローテーション）"
        required: false
        type: choice
        options: ["", trend, basics, service, voice, cheer]
        default: ""

concurrency:
  group: daily-article
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (日本語フォント — サムネカード用)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pip install -r scripts/requirements.txt
      - run: npm ci

      - name: Generate today's article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # 2026-09-25: Gemini無料枠の消費を抑えるため既定を links（LLM不要のリンクチェックのみ）に変更。
          # 新規記事生成には影響しない。既存記事の軽いリライトをまた有効にしたい場合は
          # Actions Variables の IMPROVE_MODE を full に設定すれば上書きできる。
          IMPROVE_MODE: ${{ vars.IMPROVE_MODE || 'links' }}
          THUMB_HEADLINE: ${{ vars.THUMB_HEADLINE }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          # --no-threads: Threadsへの投稿はここではしない。ここで使う画像URL(ogImage)は
          # まだCloudflareにデプロイされておらず404になるため、投稿は"Deploy to Cloudflare Pages"の
          # 後の専用ステップで行う（image_urlがライブになってから）。
          ARGS="--daily --no-threads"
          if [ -n "${{ github.event.inputs.type }}" ]; then ARGS="$ARGS --type ${{ github.event.inputs.type }}"; fi
          python scripts/pipeline.py $ARGS

      - name: Show result
        run: |
          echo "### 生成結果" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/last_result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check result
        run: |
          R=$(python -c "import json;print(json.load(open('data/last_result.json'))['result'])")
          echo "result=$R"
          if [ "$R" = "no_key" ]; then
            echo "::error::GEMINI_API_KEY (Secret) が未設定です。Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          if [ "$R" = "error" ]; then
            echo "::error::パイプラインでエラー。ログを確認してください。"
            exit 1
          fi
          if [ "$R" = "rate_limited" ]; then
            echo "::warning::Gemini の無料枠上限に達したため今回は記事を作りませんでした。次回の実行で回復します。"
          fi
          # Threadsの投稿結果は、デプロイ後の "Post to Threads" ステップで確認する
          # （--no-threads を指定しているので、ここでの result.threads は常に disabled）。

      - name: Verify build
        run: npm run build
        env:
          # GA4 測定ID（リポジトリの Actions Variables に登録。未登録ならGAタグなしでビルドされる）
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

      - name: Commit & push
        run: |
          git config user.name "kzi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 生成物をステージ（存在しないパスがあっても止まらないよう1つずつ）
          for p in src/content/blog public/images data REVIEW.md; do
            [ -e "$p" ] && git add -A "$p"
          done
          if git diff --cached --quiet; then
            echo "変更なし（ネタ切れ等）。何もしない。"
            exit 0
          fi
          # 注意: [skip ci] は付けない。Cloudflare Pages がその文字列でデプロイを丸ごとスキップするため。
          # このワークフローは push では起動しない（schedule / workflow_dispatch のみ）ので自己ループはしない。
          git commit -m "chore(content): 自動記事更新 $(date -u +%F)"
          git push

      # Cloudflare の GitHub 連携に依存せず、ここから直接デプロイする（連携が切れても確実に公開される）。
      # 必要な Secrets: CLOUDFLARE_API_TOKEN（テンプレート「Edit Cloudflare Workers」）, CLOUDFLARE_ACCOUNT_ID
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=zaiaku-zero-ikuji --branch=main --commit-dirty=true

      # デプロイ完了後、画像(ogImage)がライブになってから投稿する。
      # ここより前(Generate today's article)でpost_threadsを呼ぶと、まだ
      # Cloudflareにデプロイされていない画像URLをThreads側が取得できず失敗するため。
      - name: Post to Threads (image is live now)
        if: ${{ env.THREADS_ACCESS_TOKEN != '' && env.THREADS_USER_ID != '' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          R=$(python -c "import json;print(json.load(open('data/last_result.json'))['result'])")
          if [ "$R" != "published" ]; then
            echo "新規記事なし（result=$R）のためThreads投稿はスキップします。"
            exit 0
          fi
          SLUG=$(python -c "import json;print(json.load(open('data/last_result.json'))['slug'])")
          # CDNへの伝搬を少し待つ（保険。wranglerのdeployはCDN反映を待たず戻ることがあるため）
          sleep 15
          if ! python scripts/threads_check.py --slug "$SLUG" --post; then
            echo "::warning::Threads 投稿に失敗しました（記事公開には影響なし）。上のログの 'Threads: 投稿失敗' を確認してください。"
          fi
