# 自動記事パイプラインのネタ帳（キュレーション型）
# ------------------------------------------------------------------
# ここに「書きたいトピック」を貯めておくと、pipeline.py が毎日ローテーション
# （trend → basics → service → voice → cheer）で1件ずつ選んで記事化する。
#
# 各エントリ:
#   slug             : 記事URL。ASCII・ハイフン区切り・サイト内で一意（必須）
#   type             : trend | basics | service | voice | cheer（必須）
#   title_seed       : タイトルの種（日本語でOK。LLMが整える）
#   angle            : 切り口メモ。どの視点で書くか
#   category         : gohan | nenne | kokoro | hatsuiku | kurashi（省略可。省略時はLLMが判断）
#   official_sources : 事実の根拠にする公的機関等のURL（本文はここから取る）
#   ref_urls         : 大手競合の“良質な記事”URL。※見出し構成の参考のみ。本文は取り込まない
#   seed_facts       : （任意）自分で書いた確かな事実。official_sources が弱いとき用
#   status           : queued（未使用） / candidate（自動収集分） / published（使用済み・自動更新）
# ------------------------------------------------------------------

